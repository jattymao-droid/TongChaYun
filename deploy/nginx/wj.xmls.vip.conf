server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name wj.xmls.vip;
    index index.html index.htm;
    # �����˾�̬��Դ
    root /www/wwwroot/wj.xmls.vip/admin-ui;
    client_max_body_size 20m;

    #CERT-APPLY-CHECK--START
    # ����SSL֤������ʱ���ļ���֤������� -- ����ɾ��
    include /www/server/panel/vhost/nginx/well-known/wj.xmls.vip.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/wj.xmls.vip/*.conf;

    #SSL-START SSL������ã�����ɾ�����޸���һ�д�ע�͵�404����
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/wj.xmls.vip/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/wj.xmls.vip/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    # Vue SPA����Ҫ�ñ���Ĭ�� 404.html
    # error_page 404 /404.html;

    #PHP-INFO-START  PHP�������ã�����ע�ͻ��޸�
    include enable-php-82.conf;
    #PHP-INFO-END

    #REWRITE-START URL��д��������,�޸ĺ󽫵���������õ�α��̬����ʧЧ
    include /www/server/panel/vhost/rewrite/wj.xmls.vip.conf;
    #REWRITE-END

    # ��� API��^~ ���ⱻ�����������ߣ�
    location ^~ /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # H5���/��ѯ��
    location ^~ /h5/ {
        root /www/wwwroot/wj.xmls.vip;
        try_files $uri $uri/ /h5/index.html;
    }

    # �ϴ��ļ������� ^~������ .jpg/.jpeg �ᱻ�·�ͼƬ�������ߵ��� 404��
    location ^~ /profile/ {
        alias /www/wwwroot/wj.xmls.vip/uploadPath/;
        expires 7d;
        access_log off;
    }

    # ������ SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ��ֹ���ʵ������ļ�
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # ��ֹ���ʵ�����Ŀ¼
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #һ������SSL֤����֤Ŀ¼�������
    location ~ \.well-known{
        allow all;
    }

    #��ֹ��֤����֤Ŀ¼���������ļ�
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/wj.xmls.vip.log;
    error_log  /www/wwwlogs/wj.xmls.vip.error.log;
}
